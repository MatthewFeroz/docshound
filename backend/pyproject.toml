[project]
name = "docshound-backend"
version = "1.0.0"
description = "FastAPI backend for DocsHound"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "httpx2>=2.10.0,<3",
    "langgraph>=1.2.11,<2",
    "openai>=3.1.0,<4",
    "openinference-instrumentation-langchain>=0.1.70,<0.2",
    "openinference-instrumentation-openai>=0.1.54,<0.2",
    "openinference-semantic-conventions>=0.1.32,<0.2",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.2,<2",
    "sse-starlette>=3.4.8,<4",
    "uvicorn[standard]>=0.52.3,<0.53",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3,<0.17",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
]

[tool.setuptools.packages.find]
include = ["app*"]
