services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - docshound-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  docshound-data:
